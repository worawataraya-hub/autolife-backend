        // --- Helper Utilities ---
        const downloadTxtFile = (filename, content) => {
            const element = document.createElement("a");
            const file = new Blob([content], {type: 'text/plain'});
            element.href = URL.createObjectURL(file);
            element.download = filename;
            document.body.appendChild(element);
            element.click();
            document.body.removeChild(element);
        };

        const copyToClipboard = (text) => {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).catch(err => fallbackCopy(text));
            } else {
                fallbackCopy(text);
            }
        };

        const fallbackCopy = (text) => {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.left = "-9999px";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                document.execCommand('copy');
            } catch (err) {
                console.error('Fallback copy failed', err);
            }
            document.body.removeChild(textArea);
        };

        // --- REAL AI SERVICE (via backend Gemini proxy, no API key on frontend) ---
        const callGeminiAI = async (apiKey, prompt, useSearch = false) => {
            const url = 'http://localhost:4000/api/gemini-text';
            let delay = 1000; // Start with 1 second delay
            const maxRetries = 5;

            const payload = { prompt, useSearch };

            for (let i = 0; i <= maxRetries; i++) {
                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (response.status === 503 || response.status === 429) {
                        throw new Error(`Server Overloaded (Status: ${response.status})`);
                    }

                    const data = await response.json();

                    if (data.error) {
                        if (response.status === 503 || response.status === 429) {
                            throw new Error(data.error);
                        }
                        throw new Error(data.error);
                    }

                    if (data.text) {
                        return data.text;
                    } else {
                        throw new Error('ไม่ได้รับข้อความตอบกลับจาก AI');
                    }
                } catch (error) {
                    console.warn(`Attempt ${i + 1} failed: ${error.message}`);
                    if (i === maxRetries) {
                        console.error('AI Fetch Error (Max Retries Reached):', error);
                        return null;
                    }
                    await new Promise(resolve => setTimeout(resolve, delay));
                    delay *= 2;
                }
            }
            return null;
        };

        // --- Tool Logic Handlers ---
        const generateSmartScript = async (data, apiKey) => {

                    systemPrompt = `Write a TikTok script to promote a service: "${product}". Target: ${target}. Tone: ${tone}. Focus on trust. Language: Thai. Use Emojis.`;

                    systemPrompt = `Write a TikTok product review script for "${product}". Target: ${target}. Tone: ${tone}. Include: Hook, 3 Benefits, CTA. Language: Thai. Use Emojis.`;

                const aiResult = await callGeminiAI(apiKey, systemPrompt);

                    { title: 'ที่เที่ยวหน้าหนาว', query: 'ที่เที่ยวหน้าหนาว 2024', views: '4.8M', trend: '🔥 Top 2' },
                    { title: 'เพลงฮิต TikTok', query: 'เพลงฮิต tiktok', views: '3.5M', trend: '🔥 Top 3' },
                    { title: 'รีวิว iPhone 16', query: 'รีวิว iPhone 16', views: '2.9M', trend: '🔥 Top 4' },

        // --- Tool 4: Auto-cut (Sim) ---
        const Tool4_AutoCut = () => {
            // State for handling video, script, voice selection and export
            const [videoFile, setVideoFile] = useState(null);
            const [videoUrl, setVideoUrl] = useState('');
            const [script, setScript] = useState('');
            /**
             * Voice selection:
             * - original: keep the original audio from the video
             * - male: use TTS male voice
             * - female: use TTS female voice
             * - custom: play recorded/uploaded audio
             */
            const [voice, setVoice] = useState('original');
            // Option to mute the original video track (still mixes silent track if needed)
            const [muteOriginal, setMuteOriginal] = useState(false);
            // Preview state to trigger caption overlay
            const [previewing, setPreviewing] = useState(false);
            // Array of caption objects with text, highlight flag and active flag
            const [captions, setCaptions] = useState([]);
            // Decoded audio from the uploaded video
            const [audioBuffer, setAudioBuffer] = useState(null);
            // Optional custom audio recorded or uploaded by the user
            const [customAudioBuffer, setCustomAudioBuffer] = useState(null);
            // URL for the recorded/uploaded audio for preview playback
            const [customAudioUrl, setCustomAudioUrl] = useState('');
            // Recording state and recorder instance
            const [isRecording, setIsRecording] = useState(false);
            const mediaRecorderRef = useRef(null);
            const [audioChunks, setAudioChunks] = useState([]);
            // Inserted images/clips for overlay during export
            const [insertImages, setInsertImages] = useState([]);
            // Active flags for insert images during preview; set via scheduled timeouts
            const [activeInserts, setActiveInserts] = useState([]);
            // Store timeouts so we can clear them when preview ends
            const insertTimeoutsRef = useRef([]);
            // Store a reference to the caption interval so it can be cleared on new previews
            const captionIntervalRef = useRef(null);
            // Caption font size (base value); user adjustable
            // Caption font size default to 16px for better fit on 9:16 videos
            const [captionFontSize, setCaptionFontSize] = useState(16);
            // Caption vertical position: 'top', 'third' (one third from top), 'middle', 'bottom'
            // Default caption position is one third from the top for better eye-catching placement
            // Default caption position set to 'third' (one-third from top)
            const [captionPosition, setCaptionPosition] = useState('third');
            // Maximum characters per line for caption wrapping
            // Default maximum characters per line for caption wrapping
            const [maxCharsPerLine, setMaxCharsPerLine] = useState(20);

            // Maximum words per caption segment. The script will be split into segments of N words,
            // where each segment will be treated as a single caption. This helps prevent long
            // captions from overflowing and allows multi-line export. Default is 4 words per caption.
            const [maxWordsPerLine, setMaxWordsPerLine] = useState(4);
            // Duration of the audio/video
            const [duration, setDuration] = useState(0);
            // Flag to indicate export in progress
            const [exporting, setExporting] = useState(false);
            const videoRef = useRef(null);
            const canvasRef = useRef(null);

            // Hook detection: start time (seconds) and duration (seconds) for auto zoom effect
            // Default: start at 0s and last 3s; will be updated via detectHook
            const [hookStart, setHookStart] = useState(0);
            const [hookDuration, setHookDuration] = useState(3);
            // Keep track of timeouts used for scheduling hook zoom in preview
            const hookTimeoutsRef = useRef([]);

            // Handle video upload and decode its audio for mixing
            const handleVideoUpload = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                setVideoFile(file);
                const url = URL.createObjectURL(file);
                setVideoUrl(url);
                // Decode audio from the file to get duration and buffer
                const arrayBuffer = await file.arrayBuffer();
                try {
                    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    const buffer = await audioCtx.decodeAudioData(arrayBuffer.slice(0));
                    setAudioBuffer(buffer);
                    setDuration(buffer.duration);
                } catch (err) {
                    console.warn('Failed to decode audio', err);
                    setAudioBuffer(null);
                    setDuration(0);
                }
            };

            // Handle audio upload to be used instead of original audio
            const handleAudioUpload = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const arrayBuffer = await file.arrayBuffer();
                try {
                    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    const buffer = await audioCtx.decodeAudioData(arrayBuffer.slice(0));
                    setCustomAudioBuffer(buffer);
                    setCustomAudioUrl(URL.createObjectURL(file));
                } catch (err) {
                    console.warn('Failed to decode custom audio', err);
                }
            };

            // Start recording audio via microphone
            const startRecording = async () => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    const recorder = new MediaRecorder(stream);
                    mediaRecorderRef.current = recorder;
                    setAudioChunks([]);
                    recorder.ondataavailable = (e) => {
                        if (e.data.size > 0) {
                            setAudioChunks((prev) => [...prev, e.data]);
                        }
                    };
                    recorder.onstop = async () => {
                        const blob = new Blob(audioChunks, { type: 'audio/webm' });
                        const url = URL.createObjectURL(blob);
                        setCustomAudioUrl(url);
                        // Decode recorded audio
                        const arrayBuffer = await blob.arrayBuffer();
                        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                        try {
                            const buffer = await audioCtx.decodeAudioData(arrayBuffer);
                            setCustomAudioBuffer(buffer);
                        } catch (err) {
                            console.warn('Failed to decode recorded audio', err);
                        }
                    };
                    recorder.start();
                    setIsRecording(true);
                } catch (err) {
                    console.warn('Cannot start recording', err);
                    alert('ไม่สามารถเข้าถึงไมโครโฟนได้');
                }
            };

            // Stop recording audio
            const stopRecording = () => {
                const recorder = mediaRecorderRef.current;
                if (recorder && recorder.state !== 'inactive') {
                    recorder.stop();
                    setIsRecording(false);
                }
            };

            // Add an insert image with start time and optional duration
            const handleInsertImage = (e, start, dur, position) => {
                const file = e.target.files[0];
                if (!file) return;
                const url = URL.createObjectURL(file);
                const img = new Image();
                img.src = url;
                // Use provided duration or fallback to 3 seconds
                const duration = parseFloat(dur) || 3;
                const pos = position || 'center';
                img.onload = () => {
                    setInsertImages(prev => [...prev, { image: img, url, start: parseFloat(start) || 0, duration, position: pos, type: file.type.startsWith('video') ? 'video' : 'image' }]);
                };
            };

            // Detect hook automatically based on the provided script. This function sets
            // the start and duration of the hook segment, which will be used to
            // schedule a zoom effect during preview and export. Currently, it uses a
            // simple heuristic: assume the hook occurs at the beginning of the
            // video and lasts for a few seconds proportionate to the script length.
            const detectHook = async () => {
                if (!script || script.trim().length === 0) {
                    alert('กรุณาใส่สคริปต์เพื่อวิเคราะห์ Hook');
                    return;
                }
                // Split script into words to estimate speaking time. Average Thai speaking
                // rate is roughly 2.5 words/second. We'll assume the hook lasts
                // 30% of the total reading time, bounded between 3 and 5 seconds.
                const words = script.split(/\s+/).filter(Boolean);
                const estimatedTotalSeconds = words.length / 2.5;
                let newHookDuration = estimatedTotalSeconds * 0.3;
                if (newHookDuration < 3) newHookDuration = 3;
                if (newHookDuration > 5) newHookDuration = 5;
                setHookStart(0);
                setHookDuration(newHookDuration);
                // Highlight the first caption segment as hook
                setCaptions(prev => prev.map((c, i) => ({ ...c, highlight: i === 0 })));
                alert('ตั้งค่า Hook อัตโนมัติเรียบร้อย! ระบบจะซูมช่วงต้นของวิดีโอ');
            };

            // Detect hook using Gemini AI via the existing callGeminiAI function. It will
            // parse the returned JSON to determine hookStart and hookDuration.
            const detectHookAI = async () => {
                // Use serverless function to analyse the hook
                if (!script || script.trim().length === 0) {
                    alert('กรุณาใส่สคริปต์เพื่อวิเคราะห์ Hook');
                    return;
                }
                try {
                    const response = await fetch('/.netlify/functions/geminiHook', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ script: script, maxDuration: 5 })
                    });
                    const text = await response.text();
                    let parsed;
                    try {
                        parsed = JSON.parse(text);
                    } catch (jsonErr) {
                        // fallback: try to extract numbers manually from plain text
                        const startMatch = text.match(/"?hookStart"?\s*:?\s*(\d+(\.\d+)?)/);
                        const durMatch = text.match(/"?hookDuration"?\s*:?\s*(\d+(\.\d+)?)/);
                        if (startMatch && durMatch) {
                            parsed = { hookStart: parseFloat(startMatch[1]), hookDuration: parseFloat(durMatch[1]) };
                        }
                    }
                    if (parsed && typeof parsed.hookStart === 'number' && typeof parsed.hookDuration === 'number') {
                        setHookStart(parsed.hookStart);
                        setHookDuration(parsed.hookDuration);
                        setCaptions(prev => prev.map((c, i) => ({ ...c, highlight: i === 0 })));
                        alert('วิเคราะห์ Hook ด้วย AI เสร็จสิ้น!');
                    } else {
                        await detectHook();
                    }
                } catch (err) {
                    console.error('AI hook detection failed:', err);
                    await detectHook();
                }
            };

            // Prepare captions and play preview with optional TTS or custom audio
            const handlePreview = () => {
                // Must have a video selected. Script can be empty.
                if (!videoUrl) return;
                setPreviewing(true);
                // Clear previous caption interval to avoid overlapping timers
                if (captionIntervalRef.current) {
                    clearInterval(captionIntervalRef.current);
                    captionIntervalRef.current = null;
                }
                // Clear any scheduled hook zoom timeouts from previous previews
                if (hookTimeoutsRef.current && hookTimeoutsRef.current.length) {
                    hookTimeoutsRef.current.forEach(t => clearTimeout(t));
                    hookTimeoutsRef.current = [];
                }
                const words = script.split(/\s+/).filter(Boolean);
                // Determine keywords (top 3 longest words) to highlight
                const sorted = [...words].sort((a, b) => b.length - a.length);
                const keywords = sorted.slice(0, Math.min(3, sorted.length));
                // Break into segments by number of words per caption
                const segments = [];
                for (let i = 0; i < words.length; i += maxWordsPerLine) {
                    segments.push(words.slice(i, i + maxWordsPerLine));
                }
                const captionData = segments.map(segment => ({
                    text: segment.join(' '),
                    words: segment,
                    highlight: segment.some(w => keywords.includes(w)),
                    highlightWords: segment.map(w => keywords.includes(w)),
                    active: false
                }));
                setCaptions(captionData);

                // Note: insert image scheduling will be handled later in this function after caption timing

                // Play the video from the start
                const vid = videoRef.current;
                vid.currentTime = 0;
                vid.play();
                // Speak using TTS or play custom audio based on selection
                if (voice === 'male' || voice === 'female') {
                    if ('speechSynthesis' in window) {
                        const utter = new SpeechSynthesisUtterance(script);
                        const available = speechSynthesis.getVoices();
                        // Find Thai voices first
                        const thaiVoices = available.filter(v => v.lang && v.lang.toLowerCase().startsWith('th'));
                        let selected;
                        if (voice === 'male') {
                            // look for male voice among Thai voices
                            selected = thaiVoices.find(v => {
                                const name = v.name.toLowerCase();
                                return name.includes('male') || name.includes('ชาย');
                            });
                            if (!selected) {
                                // fallback to any Thai voice if exists
                                selected = thaiVoices[0];
                            }
                        } else if (voice === 'female') {
                            selected = thaiVoices.find(v => {
                                const name = v.name.toLowerCase();
                                return name.includes('female') || name.includes('หญิง');
                            });
                            if (!selected) {
                                selected = thaiVoices[0];
                            }
                        }
                        if (selected) utter.voice = selected;
                        // Cancel any ongoing speech and speak
                        speechSynthesis.cancel();
                        speechSynthesis.speak(utter);
                    }
                } else if (voice === 'custom' && customAudioUrl) {
                    // Play custom audio file for preview
                    const audioElem = new Audio(customAudioUrl);
                    audioElem.play();
                }
                // Zoom animation for hook effect: schedule based on hookStart and hookDuration
                const container = document.getElementById('video-container');
                if (container && hookDuration > 0) {
                    const showTimeout = setTimeout(() => {
                        container.classList.add('zoom-animation');
                    }, hookStart * 1000);
                    const hideTimeout = setTimeout(() => {
                        container.classList.remove('zoom-animation');
                    }, (hookStart + hookDuration) * 1000);
                    hookTimeoutsRef.current = [showTimeout, hideTimeout];
                }
                // Caption timing
                const totalDuration = vid.duration || duration || 10;
                // Schedule caption activation only if there are caption segments
                if (captionData.length > 0) {
                    let idx = 0;
                    setCaptions(prev => prev.map((c, i) => ({ ...c, active: i === 0 })));
                    // Determine interval based on total duration and number of captions
                    const intervalMs = (totalDuration * 1000) / captionData.length;
                    captionIntervalRef.current = setInterval(() => {
                        idx++;
                        if (idx >= captionData.length) {
                            clearInterval(captionIntervalRef.current);
                            captionIntervalRef.current = null;
                            return;
                        }
                        setCaptions(prev => prev.map((c, i) => ({ ...c, active: i === idx })));
                    }, intervalMs);
                } else {
                    // No captions: ensure all caption segments inactive
                    setCaptions(prev => prev.map(c => ({ ...c, active: false })));
                }

                // Prepare insert image preview: reset active flags and schedule timeouts
                // Clear previous timeouts and schedule new insert overlays
                insertTimeoutsRef.current.forEach(t => clearTimeout(t));
                insertTimeoutsRef.current = [];
                setActiveInserts(Array(insertImages.length).fill(false));
                insertImages.forEach((item, index) => {
                    // Activate insert at its start time
                    const onTime = setTimeout(() => {
                        setActiveInserts(prev => prev.map((v, i) => (i === index ? true : v)));
                    }, (parseFloat(item.start) || 0) * 1000);
                    // Deactivate after its duration
                    const offTime = setTimeout(() => {
                        setActiveInserts(prev => prev.map((v, i) => (i === index ? false : v)));
                    }, ((parseFloat(item.start) || 0) + (parseFloat(item.duration) || 0)) * 1000);
                    insertTimeoutsRef.current.push(onTime, offTime);
                });
            };

            // Export the video with overlay and mixed audio
            const handleExport = async () => {
                // Must have a video selected
                if (!videoUrl) return;
                setExporting(true);
                const video = videoRef.current;
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                // Ensure canvas matches video size
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                // Setup audio context for mixing
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const dest = audioCtx.createMediaStreamDestination();
                // Ensure the audio context is running (it may start in a suspended state)
                if (audioCtx.state === 'suspended') {
                    try {
                        await audioCtx.resume();
                    } catch (err) {
                        console.warn('Failed to resume audio context', err);
                    }
                }
                // Decide which audio buffers to include
                // Original audio
                if (!muteOriginal && audioBuffer) {
                    const source = audioCtx.createBufferSource();
                    source.buffer = audioBuffer;
                    // Connect to the MediaStreamDestination and to the AudioContext destination so it can be heard while recording
                    source.connect(dest);
                    source.connect(audioCtx.destination);
                    source.start();
                } else {
                    // Provide a silent track if original audio is muted or missing
                    const silenceDuration = duration || video.duration || 10;
                    const silentBuffer = audioCtx.createBuffer(1, Math.ceil(audioCtx.sampleRate * silenceDuration), audioCtx.sampleRate);
                    const silentSource = audioCtx.createBufferSource();
                    silentSource.buffer = silentBuffer;
                    silentSource.connect(dest);
                    silentSource.start();
                }
                // Custom audio overlay: play if selected and available
                if (voice === 'custom' && customAudioBuffer) {
                    const customSource = audioCtx.createBufferSource();
                    customSource.buffer = customAudioBuffer;
                    // Connect custom audio to the MediaStreamDestination and to the audio context output
                    customSource.connect(dest);
                    customSource.connect(audioCtx.destination);
                    customSource.start();
                }
                // Capture canvas frames and combine with audio
                const canvasStream = canvas.captureStream(25);
                const combined = new MediaStream([...canvasStream.getVideoTracks(), ...dest.stream.getAudioTracks()]);
                // Prefer MP4 if supported; otherwise fallback to WebM
                const mimeType = MediaRecorder.isTypeSupported('video/mp4') ? 'video/mp4' : 'video/webm';
                const recorder = new MediaRecorder(combined, { mimeType });
                const chunks = [];
                recorder.ondataavailable = (e) => {
                    if (e.data.size > 0) chunks.push(e.data);
                };
                recorder.onstop = async () => {
                    // Assemble recorded data into a blob
                    const blob = new Blob(chunks, { type: mimeType });
                    let finalBlob = blob;
                    let finalExt = mimeType === 'video/mp4' ? 'mp4' : 'webm';
                    // If not MP4, attempt to convert to MP4 using ffmpeg.wasm
                    if (mimeType !== 'video/mp4') {
                        try {
                            const { createFFmpeg } = FFmpeg;
                            const ffmpeg = createFFmpeg({ log: false });
                            await ffmpeg.load();
                            // Write input file to virtual FS
                            const buffer = new Uint8Array(await blob.arrayBuffer());
                            ffmpeg.FS('writeFile', 'input.webm', buffer);
                            // Run conversion: copy video stream and encode audio to AAC
                            await ffmpeg.run('-i', 'input.webm', '-c:v', 'copy', '-c:a', 'aac', 'output.mp4');
                            // Read the converted file
                            const data = ffmpeg.FS('readFile', 'output.mp4');
                            finalBlob = new Blob([data.buffer], { type: 'video/mp4' });
                            finalExt = 'mp4';
                        } catch (err) {
                            console.error('MP4 conversion failed:', err);
                        }
                    }
                    const url = URL.createObjectURL(finalBlob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = `auto_cut_export.${finalExt}`;
                    link.click();
                    // Log the export event with the chosen extension
                    try {
                        fetch('/.netlify/functions/logUsage', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ event: 'export', ext: finalExt, timestamp: new Date().toISOString() })
                        });
                    } catch (logErr) {
                        console.warn('Usage logging failed', logErr);
                    }
                    setExporting(false);
                };
                recorder.start();
                // Draw frames with caption and insert images
                const totalDuration = video.duration || duration || 10;
                const captionData = captions;
                let idx = 0;
                const drawFrame = () => {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    // Draw base video frame with optional zoom during hook segment
                    // Calculate zoom factor based on hookStart and hookDuration
                    let scale = 1;
                    if (hookDuration > 0 && currentTime >= hookStart && currentTime < hookStart + hookDuration) {
                        // Progress ratio between 0 and 1
                        const progress = (currentTime - hookStart) / hookDuration;
                        // Gradually zoom from 1 to 1.1 (10% zoom)
                        scale = 1 + 0.1 * progress;
                    }
                    // Calculate scaled dimensions and offsets to keep video centered
                    const scaledW = canvas.width * scale;
                    const scaledH = canvas.height * scale;
                    const offsetX = -(scaledW - canvas.width) / 2;
                    const offsetY = -(scaledH - canvas.height) / 2;
                    ctx.drawImage(video, offsetX, offsetY, scaledW, scaledH);
                    // Draw insert images if within their time window
                    const currentTime = video.currentTime;
                    insertImages.forEach(({ image, start, duration: dur, position }) => {
                        if (currentTime >= start && currentTime < start + dur) {
                            // Determine position and size: left/right -> half width; center -> full
                            let drawX = 0;
                            let drawW = canvas.width;
                            if (position === 'left') {
                                drawW = canvas.width / 2;
                                drawX = 0;
                            } else if (position === 'right') {
                                drawW = canvas.width / 2;
                                drawX = canvas.width / 2;
                            } else {
                                drawW = canvas.width;
                                drawX = 0;
                            }
                            ctx.drawImage(image, drawX, 0, drawW, canvas.height);
                        }
                    });
                    // Draw caption text if exists
                    if (captionData.length > 0) {
                        const current = captionData[idx];
                        const baseSize = captionFontSize;
                        const size = current.highlight ? baseSize * 1.3 : baseSize;
                        ctx.font = `${current.highlight ? 'bold ' : ''}${size}px Prompt, sans-serif`;
                        ctx.textAlign = 'center';
                        ctx.lineWidth = 4;
                        ctx.strokeStyle = 'rgba(0, 0, 0, 0.5)';
                        ctx.fillStyle = current.highlight ? '#FBBF24' : '#FFFFFF';
                        // Break text into lines based on maxCharsPerLine first
                        const words = current.text.split(' ');
                        const charLimit = maxCharsPerLine || 30;
                        const tempLines = [];
                        let tempLine = '';
                        for (let i = 0; i < words.length; i++) {
                            const next = tempLine + (tempLine ? ' ' : '') + words[i];
                            if (next.length > charLimit && tempLine) {
                                tempLines.push(tempLine);
                                tempLine = words[i];
                            } else {
                                tempLine = next;
                            }
                        }
                        if (tempLine) tempLines.push(tempLine);
                        // Further wrap based on width constraint
                        const maxWidth = canvas.width * 0.9;
                        const lines = [];
                        tempLines.forEach(temp => {
                            let line = '';
                            temp.split(' ').forEach(word => {
                                const testLine = line + (line ? ' ' : '') + word;
                                const metrics = ctx.measureText(testLine);
                                if (metrics.width > maxWidth && line) {
                                    lines.push(line);
                                    line = word;
                                } else {
                                    line = testLine;
                                }
                            });
                            if (line) lines.push(line);
                        });
                        // Determine base y-position based on captionPosition
                        let baseY;
                        const lineHeight = size + 10;
                        if (captionPosition === 'top') {
                            // Place captions near top
                            baseY = 50;
                        } else if (captionPosition === 'middle') {
                            // Center captions vertically
                            baseY = canvas.height / 2 - ((lines.length - 1) / 2) * lineHeight;
                        } else if (captionPosition === 'third') {
                            // Place captions around one-third from the top
                            baseY = canvas.height / 3 - ((lines.length - 1) / 2) * lineHeight;
                        } else {
                            // bottom
                            baseY = canvas.height - 50 - (lines.length - 1) * lineHeight;
                        }
                        lines.forEach((ln, idxLine) => {
                            const yPos = baseY + idxLine * lineHeight;
                            ctx.strokeText(ln, canvas.width / 2, yPos);
                            ctx.fillText(ln, canvas.width / 2, yPos);
                        });
                    }
                    // Update caption index based on current time
                    idx = Math.min(Math.floor(video.currentTime / (totalDuration / captionData.length)), captionData.length - 1);
                    if (!video.paused && !video.ended) {
                        requestAnimationFrame(drawFrame);
                    }
                };
                video.currentTime = 0;
                video.play();
                drawFrame();
                video.onended = () => {
                    recorder.stop();
                };

                        <div className="flex gap-4 mt-4">

                        </div>
                        <div className="mt-6 relative" id="video-container">

                        : style === 'thumbnail'

                        : 'storytelling cinematic scene, emotional lighting';

                const platformText =
                    platform === 'tiktok'
                        ? 'optimized for TikTok vertical video cover'
                        : platform === 'facebook'
                        ? 'optimized for Facebook/Instagram post'
                        : 'optimized for general social media';

                const fallbackPrompt = `
${styleText}, ${baseAspect},
${platformText},
main idea: ${thaiDesc},
${extra},
ultra sharp, high detail, soft lighting, realistic, trending on social media
`.trim();

                try {

Convert the following Thai description into ONE concise English prompt for a text-to-image model (Gemini, Midjourney, DALL-E).

Thai description: '${thaiDesc}'

Use this information:

- Aspect ratio / framing: ${baseAspect}

- Extra constraints (in English): ${extra}

Rules:

- Do NOT include Thai in the final prompt.
- Do NOT include bullets, numbering, JSON or markdown.
- Do NOT wrap it in quotes.
The prompt should already be ready to paste into an AI image generator.`.trim();

                    const res = await callGeminiAI(apiKey || 'BACKEND_MODE', prompt, false);
                    let finalPrompt = '';

                    if (res) {
                        finalPrompt = res
                            .replace(/```.*?```/gs, '')

                            .trim();
                    }

                    setResultPrompt(finalPrompt || fallbackPrompt);
                } catch (error) {

                    setResultPrompt(fallbackPrompt);
                } finally {
                    setIsGenerating(false);
                }
            };
